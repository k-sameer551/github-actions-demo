name: Run Python

on:
  push

jobs:
  python-job:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Python
        run: python --version

      - name: Run App
        run: python app.py